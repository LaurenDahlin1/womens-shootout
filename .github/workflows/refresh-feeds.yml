name: Refresh Strava and Instagram feeds

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECRETS_WRITE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Strava events
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_OUT: ${{ runner.temp }}/strava-refresh-token
        run: node scripts/fetch-strava.mjs
        continue-on-error: true

      - name: Fetch Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_OUT: ${{ runner.temp }}/ig-access-token
        run: node scripts/fetch-instagram.mjs
        continue-on-error: true

      - name: Persist rotated API tokens
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: ${{ runner.temp }}/strava-refresh-token
          IG_ACCESS_TOKEN_FILE: ${{ runner.temp }}/ig-access-token
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SECRETS_WRITE_TOKEN is not set; rotated API tokens will not be saved back to Actions secrets."
          else
            if [ -f "$STRAVA_REFRESH_TOKEN_FILE" ]; then
              gh secret set STRAVA_REFRESH_TOKEN < "$STRAVA_REFRESH_TOKEN_FILE"
              echo "Updated STRAVA_REFRESH_TOKEN secret."
            fi
            if [ -f "$IG_ACCESS_TOKEN_FILE" ]; then
              gh secret set IG_ACCESS_TOKEN < "$IG_ACCESS_TOKEN_FILE"
              echo "Updated IG_ACCESS_TOKEN secret."
            fi
          fi

      - name: Commit feed updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh Strava and Instagram feeds"
          git push
